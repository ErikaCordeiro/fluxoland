{% extends "base.html" %}

{% block title %}Importar Proposta{% endblock %}

{% block content %}

<div class="box">
  <h1>Importar Proposta do Bling</h1>

  <p class="muted">
    Informe o número da proposta no Bling. Se preferir, cole o link público
    (<strong>doc.view.php</strong>).
  </p>

  <form method="post" action="/propostas/nova" class="form">

    <label>Número ou link da proposta (Bling)</label>
    <input
      type="text"
      name="link_bling"
      placeholder="Ex: 29527 ou https://www.bling.com.br/relatorios/doc.view.php?id=..."
      required
    >

    <div class="actions">
      <button type="submit" class="btn-primary">
        Importar Proposta
      </button>

      <a href="/propostas" class="btn-link">
        Cancelar
      </a>
    </div>

  </form>
</div>

{% endblock %}
